<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goriber Cracks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #171717;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* ─── ROTATING TEXT ─── */
        .rotating-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: nowrap;
            white-space: nowrap;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.8rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            text-align: center;
            gap: 0.05em 0.1em;
            max-width: 100%;
        }

        .static-text {
            display: inline;
            white-space: nowrap;
            color: #ffffff;
        }

        .rotate-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 1.4em;
            min-width: 1.2em;
            vertical-align: bottom;
            white-space: nowrap;
        }

        .char-wrapper {
            display: inline-block;
            overflow: hidden;
            padding: 0 0.02em;
            white-space: nowrap;
        }

        .char-el {
            display: inline-block;
            padding: 0.08em 0.18em;
            border-radius: 0.35em;
            background-color: #5e17eb;
            color: #ffffff;
            font-weight: 800;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.5s ease;
            will-change: transform, opacity;
            white-space: nowrap;
            letter-spacing: 0.02em;
            min-width: 0.1em;
            text-align: center;
        }

        .char-el.active {
            transform: translateY(0%);
            opacity: 1;
        }

        .char-el.exit {
            transform: translateY(-120%);
            opacity: 0;
        }

        .char-el.space-char {
            background: transparent !important;
            color: transparent !important;
            min-width: 0.25em;
            padding: 0;
            transform: translateY(0) !important;
            opacity: 1 !important;
            pointer-events: none;
        }

        .char-el.active {
            background: #5e17eb;
            background-image: linear-gradient(135deg, #5e17eb 0%, #7b2ff7 50%, #5e17eb 100%);
            background-size: 200% 200%;
            animation: shimmer 3s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* ─── LOGIN / SIGNUP BUTTONS ─── */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 280px;
            margin: 2.5rem auto 1rem auto;
            padding: 0.5rem 0 1rem 0;
            font-family: 'Poppins', sans-serif;
        }

        .auth-btn {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            text-align: center;
            user-select: none;
            text-decoration: none;
            display: inline-block;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .btn-login {
            border: 2px solid #5e17eb;
            background: #5e17eb;
            color: #ffffff;
            box-shadow: 0 6px 24px rgba(94, 23, 235, 0.35);
        }

        .btn-login:hover {
            background: #7a3cf0;
            border-color: #7a3cf0;
            box-shadow: 0 0 18px rgba(94, 23, 235, 0.6), 0 0 50px rgba(94, 23, 235, 0.3);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: scale(0.96) translateY(0);
        }

        .btn-signup {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border: 2px solid #5e17eb;
            background: transparent;
            color: #5e17eb;
            box-shadow: none;
        }

        .btn-signup:hover {
            color: #ffffff;
            border-color: #5e17eb;
            box-shadow: 0 0 14px rgba(94, 23, 235, 0.5), 0 0 40px rgba(94, 23, 235, 0.25);
            transform: translateY(-2px);
        }

        .btn-signup .slide-bg {
            position: absolute;
            inset: 0;
            background: #5e17eb;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 0;
            border-radius: 50px;
        }

        .btn-signup:hover .slide-bg {
            transform: scaleX(1);
        }

        .btn-signup .btn-text {
            position: relative;
            z-index: 1;
        }

        .btn-signup:active {
            transform: scale(0.96) translateY(0);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            .rotating-wrapper {
                font-size: clamp(1.4rem, 4.5vw, 2.8rem);
            }
            .char-el {
                padding: 0.06em 0.12em;
                border-radius: 0.25em;
            }
            .rotate-container {
                height: 1.5em;
            }
            .auth-btn {
                font-size: 1rem;
                padding: 0.7rem 0.8rem;
            }
        }

        @media (max-width: 420px) {
            .rotating-wrapper {
                font-size: clamp(1.1rem, 4vw, 2rem);
            }
            .char-el {
                padding: 0.04em 0.08em;
                border-radius: 0.2em;
            }
            .auth-btn {
                font-size: 0.9rem;
                padding: 0.6rem 0.7rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .char-el,
            .char-el.active,
            .char-el.exit {
                transition: none !important;
                animation: none !important;
            }
            .char-el.active {
                transform: translateY(0) !important;
                opacity: 1 !important;
            }
            .char-el.exit {
                transform: translateY(0) !important;
                opacity: 0 !important;
            }
            .char-el {
                background: #5e17eb !important;
            }
        }
    </style>
</head>
<body>

    <!-- ─── ROTATING TEXT ─── -->
    <div class="rotating-wrapper">
        <span class="static-text">We Keep Nostalgic&nbsp;</span>
        <span class="rotate-container" id="rotateContainer" aria-label="Rotating text: GEMs or Games"></span>
    </div>

    <!-- ─── LOGIN / SIGNUP BUTTONS ─── -->
    <div class="auth-container">
        <a id="login-link" href="https://goribercracks.github.io/wgames.html" style="width:100%; text-decoration:none;">
            <button class="auth-btn btn-login">Log in</button>
        </a>

        <a href="https://goribercracks.github.io/sign-up.html" style="width:100%; text-decoration:none;">
            <button class="auth-btn btn-signup">
                <span class="slide-bg"></span>
                <span class="btn-text">Sign Up</span>
            </button>
        </a>
    </div>

    <script>
        (function() {
            'use strict';

            const ROTATING_TEXTS = ['GEMs.', 'Games'];

            const STAGGER_DURATION = 35;
            const EXIT_DELAY = 250;
            const PAUSE_BEFORE_EXIT = 700;
            const CYCLE_GAP = 150;

            const EASING_IN = 'cubic-bezier(0.34, 1.56, 0.64, 1)';
            const EASING_OUT = 'cubic-bezier(0.36, 0, 0.66, 1)';

            const container = document.getElementById('rotateContainer');
            if (!container) return;

            let currentIndex = 0;
            let isAnimating = false;
            let timeoutId = null,
                exitTimeoutId = null,
                cycleTimeoutId = null;

            function splitIntoGraphemes(text) {
                if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                    const segmenter = new Intl.Segmenter('en', { granularity: 'grapheme' });
                    return Array.from(segmenter.segment(text), seg => seg.segment);
                }
                return Array.from(text);
            }

            function renderChars(word) {
                const graphemes = splitIntoGraphemes(word);
                container.innerHTML = '';
                graphemes.forEach((char) => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'char-wrapper';
                    const el = document.createElement('span');
                    el.className = 'char-el';
                    if (char === ' ') {
                        el.classList.add('space-char');
                        el.textContent = '\u00A0';
                    } else if (char === '.') {
                        el.classList.add('period-char');
                        el.textContent = '.';
                    } else {
                        el.textContent = char;
                    }
                    wrapper.appendChild(el);
                    container.appendChild(wrapper);
                });
            }

            function animateIn(callback) {
                const chars = container.querySelectorAll('.char-el:not(.space-char)');
                const total = chars.length;
                if (total === 0) { if (callback) callback(); return; }
                chars.forEach(el => {
                    el.classList.remove('active', 'exit');
                    el.style.transition = `transform 0.5s ${EASING_IN}, opacity 0.4s ease`;
                });
                chars.forEach((el, i) => {
                    setTimeout(() => { el.classList.add('active'); }, i * STAGGER_DURATION);
                });
                setTimeout(() => { if (callback) callback(); }, (total - 1) * STAGGER_DURATION + 350);
            }

            function animateOut(callback) {
                const chars = container.querySelectorAll('.char-el:not(.space-char)');
                const total = chars.length;
                if (total === 0) { if (callback) callback(); return; }
                chars.forEach((el, i) => {
                    const delay = (total - 1 - i) * STAGGER_DURATION;
                    setTimeout(() => {
                        el.classList.remove('active');
                        el.classList.add('exit');
                        el.style.transition = `transform 0.4s ${EASING_OUT}, opacity 0.35s ease`;
                    }, delay);
                });
                setTimeout(() => { if (callback) callback(); }, (total - 1) * STAGGER_DURATION + 400);
            }

            function runCycle() {
                if (isAnimating) return;
                isAnimating = true;
                clearTimeout(timeoutId);
                clearTimeout(exitTimeoutId);
                clearTimeout(cycleTimeoutId);
                const word = ROTATING_TEXTS[currentIndex];
                renderChars(word);
                animateIn(() => {
                    timeoutId = setTimeout(() => {
                        exitTimeoutId = setTimeout(() => {
                            animateOut(() => {
                                currentIndex = (currentIndex + 1) % ROTATING_TEXTS.length;
                                isAnimating = false;
                                cycleTimeoutId = setTimeout(runCycle, CYCLE_GAP);
                            });
                        }, EXIT_DELAY);
                    }, PAUSE_BEFORE_EXIT);
                });
            }

            function startRotation() {
                clearTimeout(cycleTimeoutId);
                clearTimeout(timeoutId);
                clearTimeout(exitTimeoutId);
                isAnimating = false;
                currentIndex = 0;
                const word = ROTATING_TEXTS[0];
                renderChars(word);
                const chars = container.querySelectorAll('.char-el:not(.space-char)');
                chars.forEach(el => {
                    el.classList.add('active');
                    el.style.transition = 'none';
                    el.style.transform = 'translateY(0%)';
                    el.style.opacity = '1';
                });
                void container.offsetHeight;
                chars.forEach(el => { el.style.transition = ''; });
                cycleTimeoutId = setTimeout(() => {
                    animateOut(() => {
                        currentIndex = (currentIndex + 1) % ROTATING_TEXTS.length;
                        isAnimating = false;
                        cycleTimeoutId = setTimeout(runCycle, CYCLE_GAP);
                    });
                }, 1000);
            }

            startRotation();

            window.addEventListener('beforeunload', function() {
                clearTimeout(cycleTimeoutId);
                clearTimeout(timeoutId);
                clearTimeout(exitTimeoutId);
                isAnimating = false;
            });

        })();
    </script>

</body>
</html>
