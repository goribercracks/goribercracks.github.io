<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goriber cracks</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ── ALL YOUR CSS GOES HERE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #171717;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ── Password Overlay ── */
        #overlay {
            position: fixed;
            inset: 0;
            background: #171717;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
            font-family: 'Poppins', sans-serif;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-box {
            text-align: center;
            max-width: 340px;
            width: 100%;
            padding: 0 20px;
        }

        .overlay-box h2 {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .overlay-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            outline: none;
            margin-bottom: 12px;
        }

        .overlay-box input:focus {
            border-color: #5e17eb;
        }

        .overlay-box .btn {
            padding: 12px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background: #5e17eb;
            color: #fff;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s ease;
        }

        .overlay-box .btn:hover {
            background: #6f2ff0;
        }

        .overlay-box .error {
            color: #f55;
            display: none;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        .loading-view {
            display: none;
        }

        .loading-view .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading-view .loader-wrap .label {
            font-size: 1.1rem;
            font-weight: 400;
            color: #ddd;
        }

        .loading-view .loader-wrap .label strong {
            font-weight: 600;
            color: #fff;
        }

        /* ── Spinner ── */
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Main Content ── */
        #page-content {
            display: none;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        #page-content h1 {
            font-size: 3rem;
            color: #5e17eb;
            margin-bottom: 1rem;
        }

        #page-content p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 1.5rem;
        }

        .coming-soon {
            border: 2px solid #5e17eb;
            padding: 20px 30px;
            border-radius: 12px;
            background: rgba(94, 23, 235, 0.1);
            display: inline-block;
        }

        .coming-soon span {
            font-weight: bold;
            color: #5e17eb;
        }

        .sub-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 30px;
        }

        @media (max-width: 480px) {
            #page-content h1 {
                font-size: 2rem;
            }
            .coming-soon {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── MAIN CONTENT ─── -->
    <div id="page-content">
        <h1>Goriber cracks</h1>
        <p>Your source for nostalgic games and more.</p>
        <div class="coming-soon">
            <span>🚧 Website Under Construction 🚧</span>
            <p style="font-size: 0.9rem; margin-top: 8px; color: #ccc;">Full site coming soon with games, tutorials, and more.</p>
        </div>
        <p class="sub-text">Powered by GitHub Pages</p>
    </div>

    <!-- ─── PASSWORD OVERLAY ─── -->
    <div id="overlay">
        <div class="overlay-box">
            <div id="prompt-view">
                <h2>Enter Password</h2>
                <input type="password" id="pw-input" placeholder="Password" autofocus />
                <button class="btn" id="unlock-btn">Unlock</button>
                <p class="error" id="error-msg">Wrong password. Try again.</p>
            </div>
            <div class="loading-view" id="loading-view">
                <div class="loader-wrap">
                    <div class="spinner"></div>
                    <p class="label"><strong>Logging in…</strong></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const PASSWORD = '5678';
            const STORAGE_KEY = 'site_password';

            const overlay = document.getElementById('overlay');
            const pageContent = document.getElementById('page-content');
            const promptView = document.getElementById('prompt-view');
            const loadingView = document.getElementById('loading-view');
            const pwInput = document.getElementById('pw-input');
            const unlockBtn = document.getElementById('unlock-btn');
            const errorMsg = document.getElementById('error-msg');

            function showView(viewId) {
                promptView.style.display = viewId === 'prompt' ? 'block' : 'none';
                loadingView.style.display = viewId === 'loading' ? 'block' : 'none';
            }

            function showError(show) {
                errorMsg.style.display = show ? 'block' : 'none';
            }

            function unlockPage() {
                overlay.classList.add('hidden');
                pageContent.style.display = 'block';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 600);
            }

            function savePassword(pw) {
                try { localStorage.setItem(STORAGE_KEY, pw); } catch (_) {}
            }

            function loadSavedPassword() {
                try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }
            }

            function attemptLogin(inputPw, fromSaved) {
                const pw = (inputPw || '').trim();
                showView('loading');

                const delay = fromSaved ? 800 : 1400;
                setTimeout(() => {
                    if (pw === PASSWORD) {
                        savePassword(pw);
                        unlockPage();
                    } else {
                        if (fromSaved) {
                            try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
                            showView('prompt');
                            pwInput.value = '';
                            pwInput.focus();
                            showError(true);
                        } else {
                            showView('prompt');
                            pwInput.value = '';
                            pwInput.focus();
                            showError(true);
                        }
                    }
                }, delay);
            }

            function handleSubmit() {
                const val = pwInput.value.trim();
                if (!val) { pwInput.focus(); return; }
                showError(false);
                attemptLogin(val, false);
            }

            function init() {
                const saved = loadSavedPassword();
                if (saved) {
                    showView('loading');
                    attemptLogin(saved, true);
                } else {
                    showView('prompt');
                    pwInput.focus();
                    showError(false);
                }
            }

            unlockBtn.addEventListener('click', handleSubmit);
            pwInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault();
                    handleSubmit(); }
            });

            init();
        })();
    </script>

</body>
</html>
