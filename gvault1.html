<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goriber Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* ─── RESET ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #5e17eb;
            --secondary: #a855f7;
            --bg: #0d0d0d;
            --text: #e5e5e5;
            --font: 'Fira Code', Consolas, 'Courier New', monospace;
            --glitch-duration: 0.5s;
        }

        body {
            background: #050505;
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* ─── OVERLAY ─── */
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            z-index: 999999;
            padding: 1rem;
            transition: opacity 0.5s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .glitch-card {
            background: var(--bg);
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(94, 23, 235, 0.3);
            box-shadow: 0 0 30px rgba(94, 23, 235, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            animation: cardFadeIn 0.6s ease-out;
        }

        @keyframes cardFadeIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.6em 1.2em;
            border-bottom: 1px solid rgba(94, 23, 235, 0.25);
        }

        .card-title {
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            display: flex;
            align-items: center;
            gap: 0.6em;
        }

        .card-title svg {
            width: 1.2em;
            height: 1.2em;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2;
        }

        .card-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            margin-left: 6px;
        }
        .card-dots span:nth-child(1) { background: #ff5f57; }
        .card-dots span:nth-child(2) { background: #ffbd2e; }
        .card-dots span:nth-child(3) { background: #28c840; }

        .card-body {
            padding: 1.8rem 1.5rem 2rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(94, 23, 235, 0.3);
            padding: 0.75em 0;
            font-size: 1rem;
            color: var(--text);
            font-family: var(--font);
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .form-label {
            position: absolute;
            top: 0.75em;
            left: 0;
            font-size: 1rem;
            color: var(--primary);
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus+.form-label,
        .form-group input:not(:placeholder-shown)+.form-label {
            top: -1.2em;
            font-size: 0.75rem;
            opacity: 1;
        }

        .form-group input:focus+.form-label::before,
        .form-group input:focus+.form-label::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            pointer-events: none;
        }

        .form-group input:focus+.form-label::before {
            color: var(--secondary);
            animation: glitch-anim var(--glitch-duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .form-group input:focus+.form-label::after {
            color: var(--primary);
            animation: glitch-anim var(--glitch-duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); clip-path: inset(0 0 0 0); }
            20% { transform: translate(-5px, 3px); clip-path: inset(50% 0 20% 0); }
            40% { transform: translate(3px, -2px); clip-path: inset(20% 0 60% 0); }
            60% { transform: translate(-4px, 2px); clip-path: inset(80% 0 5% 0); }
            80% { transform: translate(4px, -3px); clip-path: inset(30% 0 45% 0); }
            100% { transform: translate(0); clip-path: inset(0 0 0 0); }
        }

        .submit-btn {
            width: 100%;
            padding: 0.85em;
            margin-top: 0.5rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .submit-btn:hover,
        .submit-btn:focus {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 30px rgba(94, 23, 235, 0.4);
            outline: none;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .submit-btn .btn-text {
            position: relative;
            z-index: 1;
            transition: opacity 0.2s ease;
        }

        .submit-btn:hover .btn-text {
            opacity: 0;
        }

        .submit-btn::before,
        .submit-btn::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            background: var(--primary);
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .submit-btn:hover::before,
        .submit-btn:focus::before {
            opacity: 1;
            color: var(--secondary);
            animation: glitch-anim var(--glitch-duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        .submit-btn:hover::after,
        .submit-btn:focus::after {
            opacity: 1;
            color: #fff;
            animation: glitch-anim var(--glitch-duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both;
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.8rem;
            font-family: var(--font);
            margin-top: 0.75rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            letter-spacing: 0.05em;
        }

        .error-msg.show {
            opacity: 1;
        }

        /* ─── MAIN CONTENT (hidden until unlocked) ─── */
        #page-content {
            display: none;
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 2rem 1rem;
        }

        #page-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #5e17eb;
            margin-bottom: 1rem;
        }

        #page-content p {
            color: #999;
            margin-bottom: 2rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #5e17eb;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #7a3cf0;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 420px) {
            .card-body {
                padding: 1.2rem 1rem 1.5rem;
            }
            .card-title {
                font-size: 0.65rem;
                letter-spacing: 0.08em;
            }
            .form-group input {
                font-size: 0.9rem;
            }
            .submit-btn {
                font-size: 0.85rem;
                padding: 0.7em;
            }
            #page-content h1 {
                font-size: 1.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .glitch-card {
                animation: none !important;
            }
            .form-group input:focus+.form-label::before,
            .form-group input:focus+.form-label::after,
            .submit-btn:hover::before,
            .submit-btn:focus::before,
            .submit-btn:hover::after,
            .submit-btn:focus::after {
                animation: none !important;
                opacity: 0 !important;
            }
            .submit-btn:hover .btn-text {
                opacity: 1 !important;
            }
        }
    </style>
</head>
<body>

    <!-- ─── PASSWORD OVERLAY ─── -->
    <div id="overlay">
        <div class="glitch-card" role="dialog" aria-modal="true" aria-label="Login to Goriber Vault">

            <div class="card-header">
                <span class="card-title">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    Type Goriber Vault Password
                </span>
                <span class="card-dots">
                    <span></span><span></span><span></span>
                </span>
            </div>

            <div class="card-body">
                <div class="form-group">
                    <input type="password" id="passwordInput" placeholder=" " autofocus aria-label="Enter password" />
                    <label class="form-label" for="passwordInput" data-text="PASSWORD">PASSWORD</label>
                </div>

                <button class="submit-btn" id="submitBtn" data-text="UNLOCK">
                    <span class="btn-text">UNLOCK</span>
                </button>

                <p class="error-msg" id="errorMsg">⛔ Wrong password. Try again.</p>
            </div>
        </div>
    </div>

    <!-- ─── MAIN CONTENT ─── -->
    <div id="page-content">
        <h1>🔓 Goriber Vault</h1>
        <p>Exclusive games and content are stored here.</p>

        <div style="background:#1a1a1a; border-radius:16px; padding:3rem 1.5rem; border:1px solid rgba(94,23,235,0.2);">
            <p style="color:#555; font-size:1.2rem;">No games added yet.</p>
            <p style="color:#444; font-size:0.9rem;">Check back soon for exclusive content.</p>
        </div>

        <a href="https://goribercracks.github.io/wgames.html" class="back-link">← Back to Games</a>
    </div>

    <!-- ─── SCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            // ─── VAULT PASSWORD (case‑insensitive) ───
            const ALLOWED_PASSWORDS = ['nigga', 'Nigga'];

            const overlay = document.getElementById('overlay');
            const pageContent = document.getElementById('page-content');
            const passwordInput = document.getElementById('passwordInput');
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            function showError() {
                errorMsg.classList.add('show');
                const card = document.querySelector('.glitch-card');
                card.style.animation = 'none';
                void card.offsetHeight;
                card.style.animation = 'cardFadeIn 0.6s ease-out';
                passwordInput.focus();
                passwordInput.select();
            }

            function hideError() {
                errorMsg.classList.remove('show');
            }

            function attemptLogin() {
                const entered = passwordInput.value.trim();
                hideError();

                const matched = ALLOWED_PASSWORDS.some(
                    pw => pw.toLowerCase() === entered.toLowerCase()
                );

                if (matched) {
                    overlay.style.transition = 'opacity 0.4s ease';
                    overlay.style.opacity = '0';
                    setTimeout(function() {
                        overlay.style.display = 'none';
                        pageContent.style.display = 'block';
                    }, 450);
                } else {
                    showError();
                    setTimeout(function() {
                        passwordInput.value = '';
                        passwordInput.focus();
                    }, 300);
                }
            }

            submitBtn.addEventListener('click', attemptLogin);

            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptLogin();
                }
            });

            passwordInput.addEventListener('input', function() {
                if (errorMsg.classList.contains('show')) {
                    hideError();
                }
            });

            setTimeout(function() {
                passwordInput.focus();
            }, 400);

        })();
    </script>

</body>
</html>
