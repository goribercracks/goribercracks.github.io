<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Goriber Cracks – Android Tutorial</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at 10% 20%, #0a0c12, #030507);
      font-family: 'Inter', sans-serif;
      color: #eef2ff;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }

    /* ─── HEADER WITH LOGO ─── */
    .site-header {
      width: 100%;
      padding: 1.2rem 1rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .site-header .logo {
      max-height: 55px;
      width: auto;
      display: block;
    }

    .wrapper {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem 2rem;
    }

    .slide-card {
      background: rgba(12, 17, 27, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 1.8rem;
      border: 1px solid rgba(94, 23, 235, 0.5);
      overflow: hidden;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
    }
    .slide-content {
      padding: 1.5rem;
    }
    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .step-badge {
      background: #5e17eb;
      padding: 0.25rem 0.8rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.7rem;
    }
    .step-dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #2d334f;
      border-radius: 50%;
      transition: 0.2s;
    }
    .dot.active {
      background: #a97cff;
      box-shadow: 0 0 6px #5e17eb;
      width: 22px;
      border-radius: 11px;
    }
    .step-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-title i {
      color: #5e17eb;
      font-size: 1.6rem;
    }
    .step-animation-wrapper {
      position: relative;
      overflow: hidden;
    }
    .step-dynamic {
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    .slide-next {
      animation: slideFromRight 0.3s ease-out;
    }
    .slide-prev {
      animation: slideFromLeft 0.3s ease-out;
    }
    @keyframes slideFromRight {
      0% { opacity: 0; transform: translateX(30px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideFromLeft {
      0% { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .source-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin: 0.8rem 0;
    }
    .source-badge {
      background: #1e1f3a;
      padding: 0.3rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid #5e17eb;
    }
    .big-password {
      background: #1e1f3a;
      border-radius: 1rem;
      padding: 0.6rem;
      margin: 0.8rem 0;
      text-align: center;
      border: 1px solid #5e17eb;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .big-password span {
      font-size: 1.1rem;
      letter-spacing: 1px;
      background: #00000055;
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      font-family: monospace;
      color: #ffd966;
    }
    .instruction-list {
      list-style: none;
      margin: 0.5rem 0;
    }
    .instruction-list li {
      margin-bottom: 0.5rem;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 0.85rem;
    }
    .instruction-list li i {
      margin-top: 2px;
      color: #5e17eb;
      width: 20px;
      font-size: 0.85rem;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin: 0.8rem 0 0.3rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #1e243b;
      padding: 0.7rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
      border: 1px solid rgba(94, 23, 235, 0.5);
      color: #eef2ff;
      text-decoration: none;
      flex: 1;
      text-align: center;
    }
    .btn-primary {
      background: #5e17eb;
      border: none;
      box-shadow: 0 4px 8px rgba(94, 23, 235, 0.3);
    }
    .btn-primary:active {
      transform: scale(0.96);
    }
    .video-container {
      margin: 0.8rem 0;
      border-radius: 1rem;
      overflow: hidden;
      background: #000;
    }
    .video-container iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }
    .video-large {
      margin: 0.5rem 0;
    }
    .video-large iframe {
      min-height: 340px;
      aspect-ratio: auto;
      height: auto;
    }
    @media (max-width: 600px) {
      .video-large iframe {
        min-height: 320px;
      }
    }
    .warning-note {
      background: rgba(245, 158, 11, 0.12);
      border-left: 4px solid #f59e0b;
      padding: 0.5rem 0.7rem;
      border-radius: 0.8rem;
      margin-top: 0.8rem;
      font-size: 0.7rem;
      display: flex;
      gap: 8px;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 1rem;
    }
    .nav-btn {
      background: #1f253e;
      border: 1px solid #3a405e;
      padding: 0.7rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      transition: 0.2s;
      color: white;
      font-size: 0.85rem;
      flex: 1;
      text-align: center;
      cursor: pointer;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .switch-link {
      display: inline-block;
      margin-top: 1rem;
      color: #a97cff;
      text-decoration: underline;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }
    footer {
      text-align: center;
      font-size: 0.6rem;
      margin-top: 1rem;
      color: #6f7a9e;
    }
    @media (max-width: 480px) {
      .slide-content {
        padding: 1rem;
      }
      .step-title {
        font-size: 1.3rem;
      }
      .btn {
        padding: 0.6rem 0.8rem;
        font-size: 0.8rem;
      }
      .nav-btn {
        padding: 0.6rem 0.8rem;
        font-size: 0.8rem;
      }
      .big-password span {
        font-size: 0.9rem;
      }
      .video-large iframe {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- ─── HEADER WITH LOGO ─── -->
  <header class="site-header">
    <img
    class="logo"
    src="https://raw.githubusercontent.com/goribercracks/goribercracks.github.io/main/images/goribercrackslogo.png"
    alt="Goriber Cracks Logo"
    />
  </header>

  <div class="wrapper">
    <div class="slide-card">
      <div class="slide-content">
        <div class="step-indicator">
          <span class="step-badge" id="stepCounter">Step 1 / 5</span>
          <div class="step-dots" id="stepDots"></div>
        </div>
        <div class="step-animation-wrapper">
          <div id="stepDynamicContent" class="step-dynamic"></div>
        </div>
        <div class="nav-buttons">
          <button class="nav-btn" id="prevBtn" disabled><i class="fas fa-arrow-left"></i> Previous</button>
          <button class="nav-btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
    <div class="switch-link" id="homeLink">
      <i class="fas fa-home"></i> Back to main site
    </div>
    <footer>
      <i class="fas fa-shield-virus"></i> Tested games • Disable Play Protect temporarily
    </footer>
  </div>

  <script>
    // Android steps (5 steps, intro + 4)
    const steps = [
      {
        title: "What is Goriber Cracks?",
        icon: "fas fa-question-circle",
        content: `
          <div class="source-list">
            <span class="source-badge">Rexdl</span>
            <span class="source-badge">Dldroid</span>
            <span class="source-badge">An1</span>
            <span class="source-badge">Apkvision</span>
            <span class="source-badge">Apkaward</span>
          </div>
          <ul class="instruction-list">
            <li><i class="fas fa-cloud-download-alt"></i> <span>We collect from these trusted sites.</span></li>
            <li><i class="fas fa-bolt"></i> <span>Plug‑and‑play: download, extract, install APK.</span></li>
            <li><i class="fas fa-vial"></i> <span>Every game tested for viruses before upload.</span></li>
          </ul>
          <div class="warning-note">
            <i class="fas fa-hand-peace"></i>
            <span>We aim for 100% virus-free. If any issue occurs, we are not responsible.</span>
          </div>
        `
      },
      {
        title: "Login Password",
        icon: "fas fa-key",
        content: `
          <div class="big-password">
            <i class="fas fa-lock"></i> <strong>Current password:</strong><br>
            <span>5678</span>
          </div>
          <ul class="instruction-list">
            <li><i class="fab fa-discord"></i> <span>Join Discord → <strong>#passwords</strong> for updates.</span></li>
            <li><i class="fas fa-lock"></i> <span>Use <strong>5678</strong> to log in now.</span></li>
          </ul>
          <div class="button-group">
            <a href="https://discord.gg/eqTFkDPyXE" target="_blank" class="btn btn-primary"><i class="fab fa-discord"></i> Join Discord</a>
          </div>
          <div class="warning-note">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Password changes often — check Discord.</span>
          </div>
        `
      },
      {
        title: "ZIP Extractor",
        icon: "fas fa-file-archive",
        content: `
          <div class="big-password" style="background:#2a1e4a;">
            <i class="fas fa-unlock-alt"></i> <strong>ZIP password:</strong><br>
            <span>goribercracks</span>
          </div>
          <ul class="instruction-list">
            <li><i class="fab fa-google-play"></i> <span>Install <strong>ZArchiver</strong> from Play Store.</span></li>
            <li><i class="fas fa-key"></i> <span>Extract with password: <code>goribercracks</code></span></li>
            <li><i class="fas fa-folder-open"></i> <span>Open ZArchiver → tap .zip → Extract.</span></li>
          </ul>
          <div class="button-group">
            <a href="https://play.google.com/store/apps/details?id=ru.zdevs.zarchiver" target="_blank" class="btn btn-primary"><i class="fab fa-google-play"></i> Get ZArchiver</a>
          </div>
          <div class="warning-note">
            <i class="fas fa-lightbulb"></i> Password: <strong>goribercracks</strong> (lowercase).
          </div>
        `
      },
      {
        title: "Watch the full video carefully",
        icon: "fas fa-play-circle",
        content: `
          <div class="video-container video-large">
            <iframe src="https://player.vimeo.com/video/1170272455?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1" 
                    allow="autoplay; fullscreen; picture-in-picture" 
                    title="Play Protect guide"></iframe>
          </div>
        `
      },
      {
        title: "Finish",
        icon: "fas fa-check-circle",
        content: `
          <div style="text-align: center;">
            <p style="margin: 0.5rem 0;">Upcoming Android tutorials:</p>
            <p style="font-size: 0.85rem;">OBB setup • APK fixes</p>
            <p style="margin: 0.8rem 0; font-size: 0.8rem;">Follow Discord for updates.</p>
            <div class="button-group" style="justify-content: center;">
              <a id="finishBtn" class="btn btn-primary" style="flex: 0 1 auto; min-width: 140px;"><i class="fas fa-check-circle"></i> Finish</a>
            </div>
          </div>
        `
      }
    ];

    let currentStep = 0;
    let animating = false;
    const stepDynamicContent = document.getElementById("stepDynamicContent");
    const stepCounterSpan = document.getElementById("stepCounter");
    const stepDotsContainer = document.getElementById("stepDots");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function updateDots() {
      stepDotsContainer.innerHTML = '';
      for (let i = 0; i < steps.length; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        if (i === currentStep) dot.classList.add('active');
        stepDotsContainer.appendChild(dot);
      }
    }

    function renderStep(animationClass) {
      const step = steps[currentStep];
      let html = `
        <div class="step-title">
          <i class="${step.icon}"></i> ${step.title}
        </div>
        ${step.content}
      `;
      if (animationClass) stepDynamicContent.classList.add(animationClass);
      stepDynamicContent.innerHTML = html;
      if (animationClass) setTimeout(() => stepDynamicContent.classList.remove(animationClass), 300);

      stepCounterSpan.innerText = `Step ${currentStep+1} / ${steps.length}`;
      updateDots();
      prevBtn.disabled = (currentStep === 0);
      if (currentStep === steps.length - 1) {
        nextBtn.innerHTML = 'Complete <i class="fas fa-check-circle"></i>';
      } else {
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
      }

      if (currentStep === steps.length - 1) {
        const finishBtn = document.getElementById('finishBtn');
        if (finishBtn) {
          finishBtn.onclick = () => {
            window.location.href = "https://goribercracks.github.io/";
          };
        }
      }
    }

    function changeStep(delta) {
      if (animating) return;
      if (delta === 1 && currentStep === steps.length - 1) {
        window.location.href = "https://goribercracks.github.io/";
        return;
      }
      const newStep = currentStep + delta;
      if (newStep < 0 || newStep >= steps.length) return;
      animating = true;
      const animationClass = delta === 1 ? 'slide-next' : 'slide-prev';
      currentStep = newStep;
      renderStep(animationClass);
      setTimeout(() => { animating = false; }, 320);
    }

    prevBtn.addEventListener("click", () => changeStep(-1));
    nextBtn.addEventListener("click", () => changeStep(1));

    document.getElementById("homeLink").addEventListener("click", () => {
      window.location.href = "https://goribercracks.github.io/";
    });

    renderStep(null);
  </script>

</body>
</html>
